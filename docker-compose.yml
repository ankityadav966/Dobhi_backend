services:
  postgres:
    image: postgres:16-alpine
    container_name: dobhi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dobhi_db}
      POSTGRES_USER: ${POSTGRES_USER:-dobhi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dobhi_secure_password_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dobhi_user} -d ${POSTGRES_DB:-dobhi_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dobhi-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dobhi-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5001}:5001"
    environment:
      NODE_ENV: production
      PORT: 5001
      TZ: UTC
      DATABASE_URL: postgresql://${POSTGRES_USER:-dobhi_user}:${POSTGRES_PASSWORD:-dobhi_secure_password_2026}@postgres:5432/${POSTGRES_DB:-dobhi_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dobhi_jwt_secret_key_change_in_production}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dobhi_jwt_refresh_secret_key_change_in_production}
      JWT_REFRESH_EXPIRE: ${JWT_REFRESH_EXPIRE:-30d}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      OTP_EXPIRE: ${OTP_EXPIRE:-600}
      OTP_PROVIDER: ${OTP_PROVIDER:-twilio}
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAYX_ACCOUNT_NUMBER: ${RAZORPAYX_ACCOUNT_NUMBER}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dobhi-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dobhi-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@dobhi.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-dobhi_admin_secret_2026}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dobhi-network

volumes:
  postgres_data:
    name: dobhi_postgres_data
  pgadmin_data:
    name: dobhi_pgadmin_data

networks:
  dobhi-network:
    name: dobhi_network
    driver: bridge
